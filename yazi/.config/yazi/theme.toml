# yazi theme — mapped to koda.nvim palette (oskarnurm/koda.nvim, orange variant).
# Source of truth: koda.nvim orange palette (synced to your nvim color map).
#
# Palette mapping (kept here for reference; if you switch nvim themes via
# lua/config/theme.lua, swap the hex values below to match):
#
#   bg        #101010   base background (terminal already paints this)
#   line      #272727   surface / panels / status bar
#   dim       #474747   borders, separators
#   fg        #DCD7BA   text
#   comment   #50585d   dim text, hints
#   highlight #458ee6   accent / selection / cursor
#   info      #8ebeec   info / hovered preview
#   success   #86cd82   added / running
#   warning   #d9ba73   modified / pending
#   danger    #ff7676   deleted / errors
#   const     #d9ba73   yellow
#   cyan      #5abfb5   numbers / count
#   pink      #f2a4db   selected marker
#   orange    #ff5733   cut marker

# ════════════════════════════════════════════════════════════════════
# Manager (the main file list pane)
# ════════════════════════════════════════════════════════════════════
[flavor]
dark = "koda"


[mgr]
cwd = { fg = "#458ee6" }

# Symlink target (shown after " -> ")
symlink_target = { fg = "#50585d", italic = true }

# Find (after pressing /)
find_keyword  = { fg = "#d9ba73", italic = true, bold = true }
find_position = { fg = "#f2a4db", bg  = "reset", italic = true }

# Marker column (left edge — copy/cut/selection indicators)
marker_copied   = { fg = "#86cd82", bg = "#86cd82" }
marker_cut      = { fg = "#ff5733", bg = "#ff5733" }
marker_marked   = { fg = "#5abfb5", bg = "#5abfb5" }
marker_selected = { fg = "#f2a4db", bg = "#f2a4db" }

# Count badges next to tabs
count_copied   = { fg = "#101010", bg = "#86cd82" }
count_cut      = { fg = "#101010", bg = "#ff5733" }
count_selected = { fg = "#101010", bg = "#f2a4db" }

# Borders between panes
border_symbol = "│"
border_style  = { fg = "#474747" }

# ════════════════════════════════════════════════════════════════════
# Indicator — the hovered/cursor row (yazi 26 moved this out of [mgr]).
#   current = hovered row in the active pane
#   parent  = hovered row in the parent pane
#   preview = hovered row when focus is in the preview pane
# ════════════════════════════════════════════════════════════════════
[indicator]
current = { fg = "#101010", bg = "#458ee6" }
parent  = { fg = "#101010", bg = "#458ee6" }
preview = { underline = true }

# ════════════════════════════════════════════════════════════════════
# Tab strip (yazi 26 moved tab styling out of [mgr] into [tabs]).
# ════════════════════════════════════════════════════════════════════
[tabs]
active   = { fg = "#101010", bg = "#458ee6", bold = true }
inactive = { fg = "#DCD7BA", bg = "#272727" }

# Code-preview syntax highlighting is supplied by the active flavor: since
# the koda flavor sets `syntect_theme = ""`, yazi loads
# `flavors/koda.yazi/tmtheme.xml` (the koda orange palette: #101010 bg,
# #DCD7BA fg, #ffffb8 strings, #8ebeec funcs, #777777 keywords/types).
# To override per-theme, set `syntect_theme = "your.tmTheme"` under [mgr].

# ════════════════════════════════════════════════════════════════════
# Mode indicator (NORMAL / SELECT / UNSET in the status bar)
# ════════════════════════════════════════════════════════════════════
[mode]
normal_main = { fg = "#101010", bg = "#458ee6", bold = true }
normal_alt  = { fg = "#458ee6", bg = "#272727" }

select_main = { fg = "#101010", bg = "#86cd82", bold = true }
select_alt  = { fg = "#86cd82", bg = "#272727" }

unset_main  = { fg = "#101010", bg = "#ff7676", bold = true }
unset_alt   = { fg = "#ff7676", bg = "#272727" }

# ════════════════════════════════════════════════════════════════════
# Status bar (path, permissions, progress, byte count)
# ════════════════════════════════════════════════════════════════════
[status]
# Yazi 26+ schema. sep_left = mode/size badges on the left.
# sep_right = percent/position on the right.
#  (U+E0B6) = left half-circle,  (U+E0B4) = right half-circle.
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress bar (e.g. when copying files)
progress_label  = { fg = "#DCD7BA", bold = true }
progress_normal = { fg = "#458ee6", bg = "#272727" }
progress_error  = { fg = "#ff7676", bg = "#272727" }

# Permissions (r/w/x bits) — yazi 26+ key names
perm_sep   = { fg = "#474747" }
perm_type  = { fg = "#458ee6" }
perm_read  = { fg = "#d9ba73" }
perm_write = { fg = "#ff7676" }
perm_exec  = { fg = "#86cd82" }

# ════════════════════════════════════════════════════════════════════
# Pick popup (e.g. after :Yazi → move to file picker)
# ════════════════════════════════════════════════════════════════════
[pick]
border   = { fg = "#474747" }
active   = { fg = "#458ee6", bold = true }
inactive = {}

# ════════════════════════════════════════════════════════════════════
# Input prompts (rename, create, etc.)
# ════════════════════════════════════════════════════════════════════
[input]
border   = { fg = "#474747" }
title    = { fg = "#DCD7BA" }
value    = { fg = "#DCD7BA" }
selected = { reversed = true }

# ════════════════════════════════════════════════════════════════════
# Confirmation dialogs (delete confirm, etc.)
# ════════════════════════════════════════════════════════════════════
[confirm]
border  = { fg = "#474747" }
title   = { fg = "#458ee6" }
body    = {}
list    = {}
btn_yes = { reversed = true }
btn_no  = {}

# ════════════════════════════════════════════════════════════════════
# Tab-completion menu inside the input bar
# ════════════════════════════════════════════════════════════════════
[cmp]
border   = { fg = "#474747" }
active   = { bg = "#458ee6", fg = "#101010" }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

# ════════════════════════════════════════════════════════════════════
# Tasks pane (w to open) — shows running file operations
# ════════════════════════════════════════════════════════════════════
[tasks]
border  = { fg = "#474747" }
title   = { fg = "#458ee6" }
hovered = { fg = "#458ee6", underline = true }

# ════════════════════════════════════════════════════════════════════
# Which-key popup (after pressing g, z, etc.)
# ════════════════════════════════════════════════════════════════════
[which]
mask            = { bg = "#101010" }
cand            = { fg = "#458ee6" }
rest            = { fg = "#50585d" }
desc            = { fg = "#DCD7BA" }
separator       = "  "
separator_style = { fg = "#474747" }

# ════════════════════════════════════════════════════════════════════
# Help screen (?)
# ════════════════════════════════════════════════════════════════════
[help]
on      = { fg = "#458ee6" }
run     = { fg = "#86cd82" }
desc    = { fg = "#DCD7BA" }
hovered = { bg = "#272727", bold = true }
footer  = { fg = "#101010", bg = "#458ee6" }

# ════════════════════════════════════════════════════════════════════
# Floating notifications (top-right toasts)
# ════════════════════════════════════════════════════════════════════
[notify]
title_info  = { fg = "#86cd82" }
title_warn  = { fg = "#d9ba73" }
title_error = { fg = "#ff7676" }

# ════════════════════════════════════════════════════════════════════
# File-type colors (mime-based — colors filenames in the manager)
# Rules are evaluated top-to-bottom; first match wins.
# ════════════════════════════════════════════════════════════════════
[filetype]
rules = [
  # Images / video / audio — koda pink/orange family
  { mime = "image/*",       fg = "#f2a4db" },
  { mime = "video/*",       fg = "#ff5733" },
  { mime = "audio/*",       fg = "#d9ba73" },

  # Archives — orange
  { mime = "application/zip",            fg = "#ff5733" },
  { mime = "application/gzip",           fg = "#ff5733" },
  { mime = "application/x-tar",          fg = "#ff5733" },
  { mime = "application/x-bzip",         fg = "#ff5733" },
  { mime = "application/x-bzip2",        fg = "#ff5733" },
  { mime = "application/x-7z-compressed", fg = "#ff5733" },
  { mime = "application/x-rar",          fg = "#ff5733" },
  { mime = "application/xz",             fg = "#ff5733" },

  # Documents — info blue
  { mime = "application/doc",     fg = "#8ebeec" },
  { mime = "application/pdf",     fg = "#8ebeec" },
  { mime = "application/rtf",     fg = "#8ebeec" },
  { mime = "application/msword",  fg = "#8ebeec" },

  # Source code (catch-all for text/*) — default fg, dim a bit
  { mime = "text/*",         fg = "#DCD7BA" },

  # Executables — green
  { mime = "application/x-executable", fg = "#86cd82" },

  # Directories — accent + bold
  { url = "*/", fg = "#458ee6", bold = true },

  # Hidden files — dim
  { url = ".*", fg = "#50585d" },

  # Fallback — moss fg
  { url = "*", fg = "#DCD7BA" },
]

# ════════════════════════════════════════════════════════════════════
# Git plugin colors + sign glyphs (from yazi-rs/plugins:git)
# Read by main.lua via th.git.<key>. Plain ASCII signs per user pref.
# ════════════════════════════════════════════════════════════════════
[git]
# Signs (the actual characters next to each file)
modified_sign  = "M"
added_sign     = "S"
deleted_sign   = "D"
updated_sign   = "U"
untracked_sign = "?"
ignored_sign   = " "
unknown_sign   = ""
clean_sign     = ""

# Colors mapped to koda orange palette
modified  = { fg = "#d9ba73", bold = true }   # koda warning amber
added     = { fg = "#86cd82", bold = true }   # koda success green
deleted   = { fg = "#ff7676", bold = true }   # koda danger red
updated   = { fg = "#ff5733" }                # koda orange — distinct from modified
untracked = { fg = "#458ee6" }                # koda highlight blue
ignored   = { fg = "#474747" }                # koda dim
unknown   = { fg = "#50585d" }                # koda comment
clean     = { fg = "#50585d" }

