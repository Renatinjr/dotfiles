# Terminal multiplexer
# https://github.com/tmux/tmux

# ================ GENERAL SETTINGS ================
set-option -g focus-events on
set-option -g display-time 3000

# Key bindings
bind J resize-pane -D 20
bind K resize-pane -U 20
bind L resize-pane -L 20
bind H resize-pane -R 20
# C-h/j/k/l and C-arrow pane navigation live in the VIM NAVIGATION
# section further down - vim-tmux-navigator binds them so the same keys
# also move between Neovim splits.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ================ COLOR SETTINGS ================
set -g default-terminal "tmux-256color"
set -ga terminal-features "*:RGB"
set -as terminal-overrides ",xterm-ghostty:RGB"
set -g extended-keys on
set -s extended-keys-format csi-u

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_current_command}'
set-window-option -g mode-keys vi


set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g mouse on              # enable mouse support
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 2     # update the status bar every 2 seconds

set -g status-left " "
set -g status-left-length 200
set -g status-right-length 200
set -g status-position bottom
set -g status-style 'bg=default' # transparent

# ================ KANSO ZEN COLOR PALETTE ================
# Based on Kanso Zen theme - deep & rich colors for focused coding
# Inspired by Kanagawa theme with darker backgrounds and muted accents

# Background colors (sumiInk variants)
zen_bg="#16161D"           # Deep background (sumiInk3)
zen_bg_dark="#1F1F28"      # Darker variant (sumiInk4)
zen_bg_darker="#0D0C0C"    # Darkest (sumiInk0)

# Foreground colors
zen_fg="#DCD7BA"           # Main foreground (fujiWhite)
zen_fg_dim="#C8C093"       # Dimmed foreground (oldWhite)

# Accent colors (muted and elegant)
zen_blue="#7FB4CA"         # Soft blue (crystalBlue)
zen_purple="#957FB8"       # Muted purple (oniViolet)
zen_red="#E46876"          # Soft red (samuraiRed) - used for high values
zen_orange="#E6C384"       # Warm orange/yellow (carpYellow)
zen_green="#98BB6C"        # Sage green (springGreen)
zen_teal="#7AA89F"         # Muted teal (waveAqua2)

# UI colors
zen_gray="#54546D"         # Medium gray (sumiInk6)
zen_comment="#727169"      # Comment gray (fujiGray)

# ================ STATUS BAR ================
# The [cpu ...] [mem ...] segment is drawn by statusline-sysload.sh, which
# wraps a single tmux-mem-cpu-load reading and colors it from the palette
# above: blue under 60%, orange 60-80%, red over 80%.
# Keep the palette in that script in sync with the one here.

set -g status-right "#(~/.config/tmux/statusline-sysload.sh) #[fg=$zen_comment]| #[fg=$zen_teal]󰥔 %H:%M #[fg=$zen_comment]| #[fg=$zen_green]󰟀 #H"

# Window status
set -g window-status-current-format "#[fg=$zen_purple,bold]#W"
set -g window-status-format "#[fg=$zen_comment]#W"

# Message and mode styles
set -g message-command-style "bg=default,fg=$zen_orange"
set -g message-style "bg=default,fg=$zen_orange"
set -g mode-style "bg=default,fg=$zen_orange"

# Pane borders
set -g pane-active-border-style "fg=$zen_blue,bg=default"
set -g pane-border-style "fg=$zen_gray,bg=default"

set -g allow-passthrough on

# ================ PLUGINS ================
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'omerxx/tmux-sessionx'

# ================ VIM NAVIGATION ================
# One set of keys moves between tmux panes AND Neovim splits. Each binding
# first inspects the active pane's process list; if Neovim (or fzf) is
# running there the key is forwarded to it instead of moving the tmux pane.
# The Neovim half is ~/.config/nvim/lua/plugins/tools.lua - keep both sides
# on the same keys.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Letters and Ctrl+arrows both navigate (space-separated = multiple keys).
# NOTE: C-h/C-l used to be swapped here (C-l moved left); they now follow
# the vim convention that Neovim was already using.
set -g @vim_navigator_mapping_left  'C-h C-Left'
set -g @vim_navigator_mapping_down  'C-j C-Down'
set -g @vim_navigator_mapping_up    'C-k C-Up'
set -g @vim_navigator_mapping_right 'C-l C-Right'
set -g @vim_navigator_mapping_prev  'C-\'

# C-l is pane-right now, so clear-screen moves to prefix + C-l (plugin default).
set -g @vim_navigator_prefix_mapping_clear_screen 'C-l'

# Leave at 0: navigating out of a zoomed pane unzooms it. Setting this to 1
# makes the plugin wrap each binding in an if-shell that its own
# copy-mode-vi bind-key passes unquoted, so all ten copy-mode bindings fail
# with "if-shell: too many arguments" and silently fall back to tmux defaults.
set -g @tmux_navigator_disable_when_zoomed '0'

# Which processes count as "vim" for the pass-through check.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

# tmux-mem-cpu-load is a standalone binary, not a tpm plugin.
# Install it with: brew install tmux-mem-cpu-load
# (see status-right above for how it is invoked)
# https://github.com/thewtex/tmux-mem-cpu-load

# Plugin manager (must be at end)
set -g @plugin 'tmux-plugins/tpm'
run "$HOME/.tmux/plugins/tpm/tpm"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ================ CMD (⌘) + CTRL KEY MAPPING ================
# tmux has no Super/Cmd modifier: bindings only understand C-, M- and S-.
# So Cmd is routed in via user-keys — the terminal (Ghostty/kitty) translates
# each Cmd chord into a private escape sequence, and tmux binds that sequence.
# The matching terminal side lives in:
#   ~/Library/Application Support/com.mitchellh.ghostty/config
#   ~/.config/kitty/kitty.conf
# Keep the sequence numbers below in sync with those files.

set -s user-keys[0]  "\e[5;30000~"   # cmd+t
set -s user-keys[1]  "\e[5;30001~"   # cmd+w
set -s user-keys[2]  "\e[5;30002~"   # cmd+d
set -s user-keys[3]  "\e[5;30003~"   # cmd+shift+d
set -s user-keys[4]  "\e[5;30004~"   # cmd+1
set -s user-keys[5]  "\e[5;30005~"   # cmd+2
set -s user-keys[6]  "\e[5;30006~"   # cmd+3
set -s user-keys[7]  "\e[5;30007~"   # cmd+4
set -s user-keys[8]  "\e[5;30008~"   # cmd+5
set -s user-keys[9]  "\e[5;30009~"   # cmd+6
set -s user-keys[10] "\e[5;30010~"   # cmd+7
set -s user-keys[11] "\e[5;30011~"   # cmd+8
set -s user-keys[12] "\e[5;30012~"   # cmd+9

bind-key -n User0 new-window -c "#{pane_current_path}"
bind-key -n User1 confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key -n User2 split-window -h -c "#{pane_current_path}"
bind-key -n User3 split-window -v -c "#{pane_current_path}"
bind-key -n User4  select-window -t :1
bind-key -n User5  select-window -t :2
bind-key -n User6  select-window -t :3
bind-key -n User7  select-window -t :4
bind-key -n User8  select-window -t :5
bind-key -n User9  select-window -t :6
bind-key -n User10 select-window -t :7
bind-key -n User11 select-window -t :8
bind-key -n User12 select-window -t :9
